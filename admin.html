<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f0ee">
  <title>Administração | BelaCurve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f0ee;
      --panel: #fffdfc;
      --rose: #edb7af;
      --ink: #231f1d;
      --muted: #6d5f5a;
      --line: #ebddd9;
      --dark: #201d1c;
      --danger: #a34a48;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 "DM Sans", Arial, sans-serif;
    }

    h1, h2, h3 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      line-height: 1.05;
    }

    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .wrap { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }

    .topbar {
      padding: 9px 12px;
      background: var(--rose);
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    header { border-bottom: 1px solid var(--line); background: rgba(247, 240, 238, .92); }
    .nav { min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { font: 600 2.25rem/1 "Cormorant Garamond", Georgia, serif; }
    .back-link { min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-weight: 600; }

    main { padding: 34px 0 60px; }
    .page-heading { margin-bottom: 24px; }
    .eyebrow { margin: 0 0 6px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { font-size: clamp(2.6rem, 7vw, 4rem); }
    .intro { max-width: 620px; margin: 8px 0 0; color: var(--muted); }

    .card { padding: 22px; border: 1px solid var(--line); border-radius: 22px; background: var(--panel); box-shadow: 0 14px 34px rgba(35, 27, 25, .04); }
    .login-card { width: min(440px, 100%); margin: 30px auto; }
    .login-card h2, .section-title { margin-bottom: 14px; font-size: 2rem; }
    .admin-layout { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
    .admin-list { display: grid; gap: 10px; max-height: 72vh; overflow: auto; padding-right: 4px; }
    .admin-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
    .item-info { min-width: 0; }
    .item-info strong { display: block; overflow-wrap: anywhere; }
    .item-info span { color: var(--muted); font-size: .85rem; }

    .field { display: grid; gap: 6px; color: var(--muted); font-size: .92rem; }
    .field input, .field textarea, .field select {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: var(--ink);
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: #c7857d; box-shadow: 0 0 0 3px rgba(216, 145, 136, .16); }
    .field textarea { min-height: 100px; resize: vertical; }
    .product-form { display: grid; gap: 14px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; padding-top: 4px; }
    .btn { min-height: 46px; padding: 0 16px; border: 0; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
    .btn.primary { background: var(--dark); color: #fff; }
    .btn.light { border: 1px solid var(--line); background: #f8f3f1; color: var(--ink); }
    .btn.danger { background: var(--danger); color: #fff; }
    .btn.small { min-width: 72px; min-height: 42px; padding: 0 12px; border: 1px solid var(--line); background: #f8f3f1; color: var(--ink); }
    .status { min-height: 24px; margin: 0; color: #2d6a4f; font-size: .9rem; }
    .hidden { display: none !important; }

    @media (max-width: 760px) {
      .wrap { width: min(100% - 20px, 600px); }
      .nav { min-height: 62px; }
      .brand { font-size: 2rem; }
      main { padding-top: 22px; }
      .admin-layout { grid-template-columns: 1fr; }
      .admin-list { max-height: none; overflow: visible; }
      .card { padding: 16px; border-radius: 18px; }
      .form-actions { grid-template-columns: 1fr; }
      .field-row { grid-template-columns: 1fr; }
      .back-link { min-height: 46px; padding: 0 12px; font-size: .9rem; }
    }

    @media (max-width: 360px) {
      .brand { font-size: 1.7rem; }
      .nav { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="topbar">BelaCurve • Administração do catálogo</div>
  <header>
    <div class="wrap nav">
      <a class="brand" href="index.html">BelaCurve</a>
      <a class="back-link" href="index.html">← Voltar à loja</a>
    </div>
  </header>

  <main class="wrap">
    <div class="page-heading">
      <p class="eyebrow">Painel de gestão</p>
      <h1>Gerenciar catálogo</h1>
      <p class="intro">Cadastre produtos, importe imagens e atualize as informações que aparecem na página de exposição.</p>
    </div>

    <section class="card login-card" id="loginCard" aria-labelledby="loginTitle">
      <h2 id="loginTitle">Acesso administrativo</h2>
      <form id="loginForm" class="product-form">
        <label class="field" for="adminPassword">Senha de administrador
          <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
        </label>
        <button class="btn primary" type="submit">Entrar</button>
        <p id="loginStatus" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="adminWorkspace" class="admin-layout hidden" aria-label="Gerenciamento de produtos">
      <div class="card">
        <h2 class="section-title">Itens cadastrados</h2>
        <div id="adminList" class="admin-list"></div>
      </div>

      <div class="card">
        <h2 class="section-title" id="formTitle">Adicionar item</h2>
        <form class="product-form" id="productForm">
          <input type="hidden" id="productId">
          <label class="field" for="productName">Nome do item
            <input id="productName" type="text" required maxlength="100">
          </label>
          <div class="field-row">
            <label class="field" for="productCategory">Categoria
              <select id="productCategory">
                <option value="Acessórios">Acessórios</option>
                <option value="Bolsas">Bolsas</option>
                <option value="Joias">Joias</option>
                <option value="Beleza">Beleza</option>
                <option value="Perfume">Perfume</option>
              </select>
            </label>
            <label class="field" for="productPrice">Preço (R$)
              <input id="productPrice" type="number" min="0.01" step="0.01" required inputmode="decimal">
            </label>
          </div>
          <label class="field" for="productIcon">Letra/ícone de substituição
            <input id="productIcon" type="text" maxlength="2" placeholder="Ex.: B, ✨, J">
          </label>
          <label class="field" for="productImageUrl">URL da imagem (opcional)
            <input id="productImageUrl" type="url" placeholder="https://.../imagem.jpg" inputmode="url">
          </label>
          <label class="field" for="productImageFile">Ou escolher imagem do celular/computador
            <input id="productImageFile" type="file" accept="image/*">
          </label>
          <label class="field" for="productDescription">Descrição
            <textarea id="productDescription" required maxlength="500"></textarea>
          </label>
          <label class="field" for="productWhatsApp">WhatsApp do vendedor (com DDI e DDD)
            <input id="productWhatsApp" type="tel" placeholder="5511999999999" inputmode="tel">
          </label>
          <p id="formStatus" class="status" role="status" aria-live="polite"></p>
          <div class="form-actions">
            <button class="btn primary" type="submit">Salvar item</button>
            <button class="btn light" type="button" id="newProductBtn">Novo item</button>
            <button class="btn danger" type="button" id="deleteProductBtn">Excluir item</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "belacurve_catalog";
    const ADMIN_PASSWORD = "belacurve";
    const DEFAULT_PRODUCTS = [
      { id: 1, name: "Bolsa Curva Mini", category: "Bolsas", price: 189, description: "Tamanho compacto ideal para o dia a dia com acabamento refinado.", icon: "B", whatsapp: "5511999999999" },
      { id: 2, name: "Brinco Pétala", category: "Joias", price: 124, description: "Acessório delicado com brilho suave e visual elegante.", icon: "J", whatsapp: "5511999999999" },
      { id: 3, name: "Perfume Aura Floral", category: "Perfume", price: 219, description: "Fragrância feminina com notas florais leves e sofisticadas.", icon: "P", whatsapp: "5511999999999" },
      { id: 4, name: "Kit de Beleza Leve", category: "Beleza", price: 149, description: "Conjunto com itens essenciais para uma rotina prática e glamorosa.", icon: "K", whatsapp: "5511999999999" },
      { id: 5, name: "Pulseira Ligne", category: "Acessórios", price: 99, description: "Detalhe moderno para compor looks de elegância casual.", icon: "L", whatsapp: "5511999999999" },
      { id: 6, name: "Bolsa Clássica Aurora", category: "Bolsas", price: 259, description: "Modelo sofisticado com espaço funcional e acabamento premium.", icon: "A", whatsapp: "5511999999999" }
    ];

    const loginCard = document.getElementById("loginCard");
    const adminWorkspace = document.getElementById("adminWorkspace");
    const adminList = document.getElementById("adminList");
    let catalog = loadCatalog();

    function loadCatalog() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : DEFAULT_PRODUCTS.map((item) => ({ ...item }));
      } catch (error) {
        return DEFAULT_PRODUCTS.map((item) => ({ ...item }));
      }
    }

    function saveCatalog() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(catalog));
        document.getElementById("formStatus").textContent = "Catálogo salvo. Volte à loja para conferir as alterações.";
        return true;
      } catch (error) {
        document.getElementById("formStatus").textContent = "Não foi possível salvar. A imagem pode ser muito grande; tente uma imagem menor.";
        return false;
      }
    }

    function formatMoney(value) {
      return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(Number(value));
    }

    function renderAdminList() {
      if (!catalog.length) {
        adminList.innerHTML = '<p class="intro">Nenhum item cadastrado ainda.</p>';
        return;
      }
      adminList.innerHTML = catalog.map((item) => `
        <div class="admin-item">
          <div class="item-info"><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.category)} • ${formatMoney(item.price)}</span></div>
          <button class="btn small" type="button" data-edit-id="${Number(item.id)}">Editar</button>
        </div>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      })[character]);
    }

    function setFormValues(product = null) {
      document.getElementById("productForm").reset();
      document.getElementById("productId").value = product ? product.id : "";
      document.getElementById("productName").value = product ? product.name : "";
      document.getElementById("productCategory").value = product ? product.category : "Acessórios";
      document.getElementById("productPrice").value = product ? product.price : "";
      document.getElementById("productIcon").value = product ? product.icon || "" : "";
      document.getElementById("productImageUrl").value = product ? product.image || "" : "";
      document.getElementById("productDescription").value = product ? product.description : "";
      document.getElementById("productWhatsApp").value = product ? product.whatsapp || "5511999999999" : "5511999999999";
      document.getElementById("formTitle").textContent = product ? "Editar item" : "Adicionar item";
      document.getElementById("formStatus").textContent = "";
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("loginForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const password = document.getElementById("adminPassword").value;
      if (password !== ADMIN_PASSWORD) {
        document.getElementById("loginStatus").textContent = "Senha incorreta.";
        return;
      }
      loginCard.classList.add("hidden");
      adminWorkspace.classList.remove("hidden");
      renderAdminList();
      setFormValues();
    });

    document.getElementById("productForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = document.getElementById("productId").value;
      const name = document.getElementById("productName").value.trim();
      const imageFile = document.getElementById("productImageFile").files[0];
      const oldItem = id ? catalog.find((item) => item.id === Number(id)) : null;
      let image = document.getElementById("productImageUrl").value.trim() || (oldItem ? oldItem.image || "" : "");

      if (imageFile) {
        try {
          image = await readFileAsDataUrl(imageFile);
        } catch (error) {
          document.getElementById("formStatus").textContent = "Não foi possível importar esta imagem.";
          return;
        }
      }

      const product = {
        id: id ? Number(id) : Date.now(),
        name,
        category: document.getElementById("productCategory").value,
        price: Number(document.getElementById("productPrice").value),
        icon: (document.getElementById("productIcon").value || name[0] || "B").trim().slice(0, 2).toUpperCase(),
        image,
        description: document.getElementById("productDescription").value.trim(),
        whatsapp: document.getElementById("productWhatsApp").value.replace(/\D/g, "") || "5511999999999"
      };

      if (id) catalog = catalog.map((item) => item.id === Number(id) ? product : item);
      else catalog.unshift(product);

      if (saveCatalog()) {
        renderAdminList();
        setFormValues();
        document.getElementById("formStatus").textContent = "Item salvo no catálogo.";
      }
    });

    document.getElementById("newProductBtn").addEventListener("click", () => setFormValues());
    document.getElementById("deleteProductBtn").addEventListener("click", () => {
      const id = Number(document.getElementById("productId").value);
      if (!id) {
        document.getElementById("formStatus").textContent = "Escolha um item da lista para excluir.";
        return;
      }
      if (!confirm("Deseja realmente excluir este item do catálogo?")) return;
      catalog = catalog.filter((item) => item.id !== id);
      if (saveCatalog()) {
        renderAdminList();
        setFormValues();
        document.getElementById("formStatus").textContent = "Item excluído do catálogo.";
      }
    });

    document.getElementById("productImageFile").addEventListener("change", (event) => {
      if (event.target.files[0]) document.getElementById("productImageUrl").value = "";
    });

    adminList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-edit-id]");
      if (!button) return;
      const product = catalog.find((item) => item.id === Number(button.dataset.editId));
      if (product) {
        setFormValues(product);
        document.getElementById("productName").scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });
  </script>
</body>
</html>
